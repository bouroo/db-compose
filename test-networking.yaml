services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ct_shared_network

  redis:
    image: redis:8-alpine
    container_name: redis
    command: redis-server --requirepass ${DB_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - ct_shared_network

  test-connectivity:
    image: alpine:latest
    container_name: test-connectivity
    command: >
      sh -c "
      apk add --no-cache postgresql-client redis curl &&
      echo 'Testing PostgreSQL connectivity...' &&
      pg_isready -h postgres -p 5432 -U ${DB_USERNAME} -d ${DB_NAME} &&
      echo 'Testing Redis connectivity...' &&
      redis-cli -h redis -p 6379 -a ${DB_PASSWORD} ping &&
      echo 'Network connectivity test completed successfully!'
      "
    networks:
      - ct_shared_network
    depends_on:
      - postgres
      - redis

networks:
  ct_shared_network:
    name: ct_shared_network

volumes:
  postgres_data:
  redis_data: