  valkey-5:
    image: mirror.gcr.io/valkey/valkey:9-alpine
    container_name: valkey-5
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      VALKEY_PASSWORD: ${DB_PASSWORD}
    volumes:
      - valkey_5_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 1s
