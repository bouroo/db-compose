    command: valkey-server --cluster-enabled yes --cluster-config-file nodes.conf --protected-mode no --port 6379 --bind 0.0.0.0 --requirepass ${DB_PASSWORD}

  valkey-4:
    image: mirror.gcr.io/valkey/valkey:9-alpine
    container_name: valkey-4
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      VALKEY_PASSWORD: ${DB_PASSWORD}
    volumes:
