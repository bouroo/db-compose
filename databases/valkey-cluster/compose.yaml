services:
  valkey-0:
    image: mirror.gcr.io/valkey/valkey:9-alpine
    container_name: valkey-0
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      VALKEY_PASSWORD: ${DB_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - valkey_0_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network
    command: valkey-server --cluster-enabled yes --cluster-config-file nodes.conf --protected-mode no --port 6379 --bind 0.0.0.0 --requirepass ${DB_PASSWORD}

  valkey-1:
    image: mirror.gcr.io/valkey/valkey:9-alpine
    container_name: valkey-1
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
