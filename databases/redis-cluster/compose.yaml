      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network

  redis-node-4:
    image: redis:8-alpine
    container_name: redis-node-4
    environment:
      REDIS_PASSWORD: ${DB_PASSWORD}
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --protected-mode no --port 6379 --requirepass ${DB_PASSWORD}
    volumes:
