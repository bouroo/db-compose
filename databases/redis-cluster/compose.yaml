services:
  redis-node-0:
    image: redis:8-alpine
    container_name: redis-node-0
    environment:
      REDIS_PASSWORD: ${DB_PASSWORD}
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --protected-mode no --port 6379 --requirepass ${DB_PASSWORD}
    volumes:
      - redis_node_0_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DB_PASSWORD}", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network

  redis-node-1:
    image: redis:8-alpine
    container_name: redis-node-1
    environment:
      REDIS_PASSWORD: ${DB_PASSWORD}
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --protected-mode no --port 6379 --requirepass ${DB_PASSWORD}
    volumes:
      - redis_node_1_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DB_PASSWORD}", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network

  redis-node-2:
    image: redis:8-alpine
    container_name: redis-node-2
    environment:
      REDIS_PASSWORD: ${DB_PASSWORD}
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --protected-mode no --port 6379 --requirepass ${DB_PASSWORD}
    volumes:
      - redis_node_2_data:/data
    ports:
