services:
  valkey:
    image: valkey/valkey:8
    container_name: my-valkey-db
    environment:
      # Include common environment variables from the root compose file
      <<: *common_environment_variables
      # Valkey is a Redis fork; password configuration is similar to Redis.
      VALKEY_EXTRA_FLAGS: "--save 60 1 --loglevel warning"
      # If you want to enable a password:
      # VALKEY_PASSWORD: ${DB_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey_data:
    driver: local