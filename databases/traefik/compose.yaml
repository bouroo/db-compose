services:
  traefik:
    image: mirror.gcr.io/traefik:3
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.network=ct_shared_network
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "30080:80"
      - "38080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ct_shared_network
