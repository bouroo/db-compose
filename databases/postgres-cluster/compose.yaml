services:
  postgres-primary:
    image: postgres:18-alpine
    container_name: postgres-primary
    shm_size: 128mb
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network
    command: >
      postgres -c max_wal_senders=10 -c wal_level=replica -c hot_standby=on -c hot_standby_feedback=on -c archive_mode=on -c archive_command='cd .'

  postgres-replica-1:
    image: postgres:18-alpine
    container_name: postgres-replica-1
    shm_size: 128mb
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U ${REPLICATION_USERNAME}; do
        echo 'Waiting for postgres-primary to be ready for replication...'
        sleep 1s
      done;
      if [ ! -s /var/lib/postgresql/data/pgdata/standby.signal ]; then
        rm -rf /var/lib/postgresql/data/pgdata/*;
        pg_basebackup -h postgres-primary -U ${REPLICATION_USERNAME} -p 5432 -D /var/lib/postgresql/data/pgdata -Fp -Xs -P -R -w;
      fi;
      postgres -c hot_standby=on -c hot_standby_feedback=on"

  postgres-replica-2:
    image: postgres:18-alpine
    container_name: postgres-replica-2
    shm_size: 128mb
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ct_shared_network
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U ${REPLICATION_USERNAME}; do
        echo 'Waiting for postgres-primary to be ready for replication...'
        sleep 1s
      done;
      if [ ! -s /var/lib/postgresql/data/pgdata/standby.signal ]; then
        rm -rf /var/lib/postgresql/data/pgdata/*;
        pg_basebackup -h postgres-primary -U ${REPLICATION_USERNAME} -p 5432 -D /var/lib/postgresql/data/pgdata -Fp -Xs -P -R -w;
      fi;
      postgres -c hot_standby=on -c hot_standby_feedback=on"

  pgbouncer:
    image: mirror.gcr.io/rapidfort/pgbouncer-official:latest
    container_name: pgbouncer
    environment:
      DATABASES: "primary = host=postgres-primary port=5432 user=${DB_USERNAME} password=${DB_PASSWORD} dbname=${DB_NAME},replica1 = host=postgres-replica-1 port=5432 user=${DB_USERNAME} password=${DB_PASSWORD} dbname=${DB_NAME},replica2 = host=postgres-replica-2 port=5432 user=${DB_USERNAME} password=${DB_PASSWORD} dbname=${DB_NAME}"
      PGBOUNCER_LISTEN_PORT: 5432
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_ADMIN_USERS: ${ADMIN_UI_USERNAME}
      PGBOUNCER_STATS_USERS: ${ADMIN_UI_USERNAME}
    ports:
      - "5432:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
    networks:
      - ct_shared_network
    restart: unless-stopped

  postgres-init:
    image: postgres:18-alpine
    container_name: postgres-init
    environment:
      TZ: ${TZ}
      LANG: ${LANG}
      POSTGRES_ROOT_PASSWORD: ${DB_PASSWORD}
      POSTGRES_REPLICATION_USER: ${REPLICATION_USERNAME}
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    networks:
      - ct_shared_network
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U postgres; do
        echo 'Waiting for postgres-primary to be ready for init...'
        sleep 1s
      done;
      echo 'postgres-primary is up - executing commands';
      psql -h postgres-primary -U postgres -P ${DB_PASSWORD} -c \"CREATE USER ${REPLICATION_USERNAME} WITH REPLICATION ENCRYPTED PASSWORD '${REPLICATION_PASSWORD}';\";
      psql -h postgres-primary -U postgres -P ${DB_PASSWORD} -c \"ALTER SYSTEM SET wal_level = replica;\";
      psql -h postgres-primary -U postgres -P ${DB_PASSWORD} -c \"ALTER SYSTEM SET max_wal_senders = 10;\";
      psql -h postgres-primary -U postgres -P ${DB_PASSWORD} -c \"ALTER SYSTEM SET hot_standby = on;\";
      psql -h postgres-primary -U postgres -P ${DB_PASSWORD} -c \"SELECT pg_reload_conf();\";
      "
    restart: "no"

volumes:
  postgres_primary_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
