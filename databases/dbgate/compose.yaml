services:
  dbgate:
    image: mirror.gcr.io/dbgate/dbgate:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.localhost`)"
      - "traefik.http.routers.dbgate.entrypoints=web"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      - traefik

volumes:
  dbgate_data:
    driver: local